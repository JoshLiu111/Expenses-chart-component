<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Expenses chart component</title>
  </head>
  <body>
    <main class="wrapper">
      <h1 class="sr-only">Expenses overview</h1>

      <!-- Balance card (static) -->
      <section class="balance" aria-label="Balance">
        <div>
          <p class="balance__label">My balance</p>
          <p class="balance__amount">$921.48</p>
        </div>
        <img class="balance__logo" src="./images/logo.svg" alt="" width="72" height="48" />
      </section>

      <!-- Spending card -->
      <section class="spending" aria-labelledby="spending-title">
        <h2 class="spending__title" id="spending-title">Spending - Last 7 days</h2>

        <!-- Bars are rendered here -->
        <ol class="chart" id="chart"></ol>
        <p class="chart__error" id="chart-error" role="alert" hidden></p>

        <div class="summary">
          <div>
            <p class="summary__label">Total this month</p>
            <p class="summary__total">$478.33</p>
          </div>
          <div class="summary__change">
            <p class="summary__percent">+2.4%</p>
            <p class="summary__label">from last month</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://my-portfolio-frontend-kappa-lemon.vercel.app/">Josh</a>.
    </footer>

    <script type="module" src="./script.js"></script>
  </body>
</html>
